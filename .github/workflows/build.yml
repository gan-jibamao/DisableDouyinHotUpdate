name: Build DisableDouyinHotUpdate
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-latest
      - run: |
          if [ ! -d ~/theos ]; then
            git clone --depth 1 https://github.com/theos/theos.git ~/theos
          fi

      - name: Setup Theos vendor (sdks)
        run: |
          # Use swift5 toolchain bundled with Xcode; vendor sdk: use iPhoneOS SDK via sdks repo
          if [ ! -d ~/theos/sdks ]; then
            mkdir -p ~/theos/sdks
            git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks
          fi

      - name: Install dm.pl (dpkg)
        run: |
          curl -fsSL -o ~/theos/bin/dm.pl https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl
          chmod +x ~/theos/bin/dm.pl
          sudo ln -sf ~/theos/bin/dm.pl /usr/local/bin/dm.pl
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build package
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean || true
          make package FINAL=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: disable-douyin-hotupdate
          path: packages/*.deb

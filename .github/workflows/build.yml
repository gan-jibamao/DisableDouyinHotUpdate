name: Build DisableDouyinHotUpdate
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-full-v1

      - name: Install Theos (official installer)
        run: |
          if [ ! -f ~/theos/bin/update-theos ] || [ ! -d ~/theos/vendor/include ]; then
            rm -rf ~/theos
            bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          fi

      - name: Build package
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean || true
          make package FINAL=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: disable-douyin-hotupdate
          path: packages/*.deb
